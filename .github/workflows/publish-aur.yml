# Publishes the AUR package when a release is cut.
#
# The AUR holds only a build recipe, not a build: users' machines compile from the
# tag this workflow points them at. So "cutting AUR" is just bumping _tag/pkgver in
# the PKGBUILD, regenerating .SRCINFO, and pushing those two files to the AUR's own
# git repo -- there is no artifact to upload and nothing to attach to the release.
#
# Runs on release publication, alongside the AppImage, so the AUR never lags the
# other channels. The Flatpak stays monthly (see build-flatpak.yml) because it is
# slow and self-updates; the AUR is cheap here because no compilation happens.
#
# Requires one repository secret:
#   AUR_SSH_PRIVATE_KEY -- a private key whose public half is registered on the
#                          AUR account that owns the package.
name: Publish to AUR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.4.0.5366-alpha)'
        required: true
      dry_run:
        description: 'Build and validate, but do not push to the AUR'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The bump to PKGBUILD/.SRCINFO is committed back to this repository, and the
    # default token is read-only for `release` events. Without this the whole job
    # fails at the push with "Permission to ... denied to github-actions[bot]",
    # after having done all the work -- which is how v1.4.0.5397-alpha shipped
    # with the recipe still pinned to the previous release.
    permissions:
      contents: write
    # makepkg --printsrcinfo is the only supported way to generate .SRCINFO, and it
    # only exists on Arch, so the whole job runs in an Arch container.
    container: archlinux:base-devel

    steps:
      - name: Resolve the tag being published
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          [ -n "$TAG" ] || { echo "::error::no tag to publish"; exit 1; }

          # The AUR is a STABLE-only channel.
          #
          # This fires on every published release, and an alpha tag used to be
          # published here with its suffix stripped -- v1.4.0.5397-alpha became
          # pkgver 1.4.0.5397. pacman upgrades on version alone, so `yay -Syu`
          # moved Arch users onto alpha builds silently, indistinguishably from
          # stable, every few days. The launcher has a release-channel setting to
          # prevent exactly that; a distro package has no equivalent, so the
          # filtering has to happen here.
          #
          # Deliberately not skipped quietly: a release that does not reach the
          # AUR should say so in the log, or the next person debugging "why is the
          # AUR behind?" has nothing to go on.
          case "$TAG" in
            *-alpha|*-prototype)
              echo "::notice::$TAG is an alpha/prototype tag; the AUR tracks stable releases only, so there is nothing to publish."
              echo "skip_channel=1" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          PKGVER="${TAG#v}"
          case "$PKGVER" in
            *[!0-9.]*) echo "::error::tag '$TAG' does not yield a numeric pkgver ('$PKGVER')"; exit 1 ;;
          esac
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "pkgver=$PKGVER" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG as pkgver $PKGVER"

      - name: Install tooling
        if: steps.tag.outputs.skip_channel != '1'
        run: pacman -Syu --noconfirm --needed git openssh

      - uses: actions/checkout@v4

      - name: Bump the PKGBUILD to this release
        if: steps.tag.outputs.skip_channel != '1'
        working-directory: packaging/aur
        run: |
          # One split package builds both outputs, so there is a single version to
          # bump and engine/data cannot drift apart.
          current_pkgver=$(sed -n 's|^pkgver=||p' PKGBUILD)
          sed -i "s|^_tag=.*|_tag=${{ steps.tag.outputs.tag }}|" PKGBUILD
          sed -i "s|^pkgver=.*|pkgver=${{ steps.tag.outputs.pkgver }}|" PKGBUILD
          # pkgrel resets to 1 for a NEW version: a release is always a fresh build.
          # A republish of the SAME version must NOT reset it. That happens when the
          # packaging changes without the engine -- shipping a pacman hook ahead of
          # the release that needs it, for instance, which has to be done because
          # pacman reads hooks at transaction start and a hook shipped in the
          # breaking upgrade never runs for it. Against a live -4, a -1 is a
          # downgrade: pacman would not offer it and the change would silently
          # never reach anyone.
          if [ "$current_pkgver" != "${{ steps.tag.outputs.pkgver }}" ]; then
            sed -i "s|^pkgrel=.*|pkgrel=1|" PKGBUILD
          else
            echo "::notice::Republishing ${current_pkgver}; keeping pkgrel=$(sed -n 's|^pkgrel=||p' PKGBUILD) rather than resetting to 1"
          fi
          grep -E '^(_tag|pkgver|pkgrel)=' PKGBUILD

      - name: Recompute the data archive checksum
        if: steps.tag.outputs.skip_channel != '1'
        id: sums
        working-directory: packaging/aur
        run: |
          # The data package pins the release asset by hash, so the hash has to be
          # recomputed for each release. Downloaded once, here, rather than trusting
          # a value copied by hand.
          URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/keeperfx-linux-alpha-x86_64-full.7z"
          # The data package pins this archive by hash, but it is attached to the
          # release by the AppImage build, which runs after the release is published.
          # On a fresh release it is therefore legitimately not there yet.
          if ! curl -fsSL --retry 3 -o /tmp/full.7z "$URL"; then
            echo "::notice::$URL is not attached yet — re-run this workflow once the AppImage build has uploaded it"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SUM=$(sha256sum /tmp/full.7z | cut -d' ' -f1)
          echo "full.7z sha256 = $SUM"
          # The archive is the second source entry, so replace the second hash.
          python3 - "$SUM" <<'EOF'
          import re, sys
          s = open('PKGBUILD').read()
          head, rest = s.split("sha256sums=(\n", 1)
          body, tail = rest.split(")\n", 1)
          parts = [l.strip() for l in body.strip().split("\n")]
          parts[1] = "'" + sys.argv[1] + "'"
          open('PKGBUILD','w').write(head + "sha256sums=(\n" + "\n".join("  "+p for p in parts) + "\n)\n" + tail)
          EOF
          grep -A5 '^sha256sums' PKGBUILD
          rm -f /tmp/full.7z

          # The three files packaged alongside the archive (the wrapper scripts and
          # the desktop entry) are pinned by hash too, and nothing was recomputing
          # them: editing one and forgetting its hash publishes a recipe that fails
          # `makepkg` for everyone, with the release itself looking perfectly fine.
          # That is exactly what shipped with v1.4.0.5411 -- the launcher wrapper had
          # been changed that morning. Recompute them from the files being published.
          python3 - <<'EOF'
          import hashlib, re
          s = open('PKGBUILD').read()
          # source entries that are plain filenames (no "::" URL form) are local files
          src_block = s.split("source=(\n", 1)[1].split(")\n", 1)[0]
          names = [l.strip().strip("'\"") for l in src_block.strip().split("\n")]
          head, rest = s.split("sha256sums=(\n", 1)
          body, tail = rest.split(")\n", 1)
          sums = [l.strip() for l in body.strip().split("\n")]
          for i, n in enumerate(names):
              if "::" in n or "/" in n or n.startswith("$"):
                  continue          # remote source or VCS entry: SKIP or handled above
              digest = hashlib.sha256(open(n, 'rb').read()).hexdigest()
              if sums[i].strip("'\"") != digest:
                  print(f"re-pinning {n}: {sums[i]} -> {digest}")
                  sums[i] = "'" + digest + "'"
          open('PKGBUILD', 'w').write(
              head + "sha256sums=(\n" + "\n".join("  " + p for p in sums) + "\n)\n" + tail)
          EOF
          grep -A7 '^sha256sums' PKGBUILD

      - name: Verify the tag actually exists upstream
        if: steps.tag.outputs.skip_channel != '1' && steps.sums.outputs.skip != '1'
        working-directory: packaging/aur
        run: |
          # Catches a release published before its tag propagated, which would
          # otherwise ship a PKGBUILD nobody can build.
          git ls-remote --exit-code --tags \
            https://github.com/${{ github.repository }}.git \
            "refs/tags/${{ steps.tag.outputs.tag }}"

      - name: Regenerate .SRCINFO
        if: steps.tag.outputs.skip_channel != '1' && steps.sums.outputs.skip != '1'
        working-directory: packaging/aur
        run: |
          # makepkg refuses to run as root, so do this as a normal user.
          useradd -m builder
          chown -R builder .
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO
          chown root .SRCINFO
          head -6 .SRCINFO

      - name: Sanity-check the generated metadata
        if: steps.tag.outputs.skip_channel != '1' && steps.sums.outputs.skip != '1'
        working-directory: packaging/aur
        run: |
          grep -q "pkgver = ${{ steps.tag.outputs.pkgver }}" .SRCINFO \
            || { echo "::error::.SRCINFO pkgver does not match the release"; exit 1; }
          grep -q "${{ steps.tag.outputs.tag }}" .SRCINFO \
            || { echo "::error::.SRCINFO does not reference the release tag"; exit 1; }
          # Both outputs must still be declared, or users lose one silently.
          for n in keeperfx-tux keeperfx-tux-data; do
            grep -q "^pkgname = $n\$" .SRCINFO \
              || { echo "::error::.SRCINFO no longer declares $n"; exit 1; }
          done
          echo "split package at ${{ steps.tag.outputs.tag }} declares both outputs"

      - name: Commit the bump back to this repo
        if: steps.tag.outputs.skip_channel != '1' && steps.sums.outputs.skip != '1' && !inputs.dry_run
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add packaging/aur/PKGBUILD packaging/aur/.SRCINFO
          if git diff --cached --quiet; then
            echo "PKGBUILDs already at this version; nothing to commit"
          else
            git commit -m "packaging: AUR package to ${{ steps.tag.outputs.tag }}"
            # Recording the bump here is bookkeeping; publishing to the AUR is the
            # job. This pushed straight at the default branch, so any commit that
            # landed there between the release and this step made the push fail --
            # which failed the step, and the AUR push is gated on it, so the
            # package silently never went out. Rebase once; if it still will not
            # go, say so and carry on to the AUR.
            git pull --rebase --autostash origin "${{ github.event.repository.default_branch }}" || true
            git push origin HEAD:${{ github.event.repository.default_branch }} \
              || echo "::warning::could not record the AUR bump on ${{ github.event.repository.default_branch }}; commit packaging/aur by hand"
          fi

      - name: Push to the AUR
        if: steps.tag.outputs.skip_channel != '1' && steps.sums.outputs.skip != '1' && !inputs.dry_run
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY is not set — add it in Settings > Secrets"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # The AUR host keys, pinned rather than fetched with ssh-keyscan at run
          # time. keyscan appeared to succeed in this container and the clone still
          # failed with "Host key verification failed", so the publish depended on a
          # step that could not be relied on -- and, being trust-on-first-use,
          # verified nothing anyway. These are the keys aur.archlinux.org serves;
          # the ed25519 fingerprint is SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4,
          # which is the value published on the Arch wiki and can be checked against
          # it. If the AUR ever rotates its keys this fails loudly, which is correct.
          cat > ~/.ssh/known_hosts <<'KNOWN_HOSTS'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLMiLrP8pVi5BFX2i3vepSUnpedeiewE5XptnUnau+ZoeUOPkpoCgZZuYfpaIQfhhJJI5qgnjJmr4hyJbe/zxow=
          KNOWN_HOSTS
          # The heredoc above is indented to match this YAML block; strip that
          # leading whitespace or ssh ignores every line as malformed.
          sed -i 's/^[[:space:]]*//' ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! grep -q '^aur.archlinux.org ssh-ed25519 ' ~/.ssh/known_hosts; then
            echo "::error::the pinned AUR host key did not land in known_hosts; refusing to continue (the publish would silently do nothing)"
            exit 1
          fi
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF

          # Diagnostics: this step reported "Host key verification failed" with both
          # a scanned and a pinned known_hosts, so print what ssh actually sees
          # rather than guessing at it again.
          echo "--- HOME=[$HOME] whoami=$(whoami) ---"
          ls -la ~/.ssh/
          echo "--- known_hosts ---"; cat ~/.ssh/known_hosts
          echo "--- config ---"; cat ~/.ssh/config
          echo "--- ssh handshake ---"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -vv aur@aur.archlinux.org 2>&1 | grep -iE "known_hosts|host key|Offering|Authenticat|debug1: Connect|Permission|Server accepts" | head -20 || true

          git config --global user.name  'KeeperFX Tux Edition CI'
          git config --global user.email 'noreply@users.noreply.github.com'

          # One AUR repository: the split package serves both outputs from it.
          if ! git clone ssh://aur@aur.archlinux.org/keeperfx-tux.git /tmp/aur 2>/tmp/aurerr; then
            cat /tmp/aurerr
            # Two states are expected rather than broken: the package has not been
            # imported yet (that first push has to be done by hand, CI only updates an
            # existing repo), and the AUR being in maintenance. Neither means this
            # release failed, so report and stop rather than failing the run.
            #
            # EVERYTHING ELSE MUST FAIL. This used to treat any non-maintenance error
            # as "not imported yet" and exit 0, so a host-key failure -- which is what
            # actually happened on the first real auto-publish -- produced a green run
            # that pushed nothing, while the package sat on the AUR the whole time.
            # A publish that does not publish has to be loud.
            if grep -qi 'maintenance' /tmp/aurerr; then
              echo "::notice::the AUR is in maintenance; skipping the AUR publish for this release"
              exit 0
            fi
            if grep -qiE 'does not exist|not found|no such repository' /tmp/aurerr; then
              echo "::notice::keeperfx-tux is not on the AUR yet; run packaging/aur/import-to-aur.sh once, then re-run this workflow"
              exit 0
            fi
            echo "::error::could not reach the AUR repository; nothing was published. See the git error above."
            exit 1
          fi
          # Every local file named in the PKGBUILD's source=() has to land in the
          # AUR repository -- that repository IS the build context, so one file
          # missing means the package fails to build for everyone who installs
          # it. keeperfx-tux-launcher.sh was already in source=() and was never
          # copied here; it survived only because the initial manual import had
          # put it there and `git add -A` leaves untouched files alone, so it
          # would have silently gone stale the moment it changed.
          for f in PKGBUILD .SRCINFO keeperfx-tux.sh keeperfx-tux.desktop \
                   keeperfx-tux-launcher.sh keeperfx-tux.hook keeperfx-tux-libcheck.sh \
                   keeperfx-tux-stash.sh keeperfx-tux-stash.hook \
                   keeperfx-tux-unstash.hook keeperfx-tux-previous.sh; do
            [ -f "packaging/aur/$f" ] \
              || { echo "::error::packaging/aur/$f is missing; the AUR build context would be incomplete"; exit 1; }
            cp "packaging/aur/$f" /tmp/aur/
          done
          # The list above is maintained by hand and has already been wrong once.
          # Rather than trust the next person to remember, check it against the
          # PKGBUILD itself: every plain (non-URL) entry in source=() is a local
          # file that must have been copied. Catches the omission here, where the
          # message can say so, instead of in every user's failing build.
          awk '/^source=\(/,/^\)/' packaging/aur/PKGBUILD \
            | grep -oE "^[[:space:]]*'[^']+'" | tr -d " '" \
            | while read -r want; do
                [ -f "/tmp/aur/$want" ] \
                  || { echo "::error::packaging/aur/$want is in the PKGBUILD's source=() but is not copied to the AUR repository; add it to the list above"; exit 1; }
              done || exit 1
          cd /tmp/aur
          git add -A
          if git diff --cached --quiet; then
            echo "AUR already up to date"
          else
            # Read the rel back rather than assuming 1: a same-version republish
            # keeps the rel the recipe carries (see the bump step above).
            git commit -m "Update to ${{ steps.tag.outputs.pkgver }}-$(sed -n 's|^pkgrel=||p' PKGBUILD)"
            git push
          fi

      - name: Dry-run summary
        if: steps.tag.outputs.skip_channel != '1' && steps.sums.outputs.skip != '1' && inputs.dry_run
        working-directory: packaging/aur
        run: |
          echo "Dry run — nothing pushed. Generated metadata:"
          cat .SRCINFO
