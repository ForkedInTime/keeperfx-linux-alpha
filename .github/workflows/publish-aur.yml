# Publishes the AUR package when a release is cut.
#
# The AUR holds only a build recipe, not a build: users' machines compile from the
# tag this workflow points them at. So "cutting AUR" is just bumping _tag/pkgver in
# the PKGBUILD, regenerating .SRCINFO, and pushing those two files to the AUR's own
# git repo -- there is no artifact to upload and nothing to attach to the release.
#
# Runs on release publication, alongside the AppImage, so the AUR never lags the
# other channels. The Flatpak stays monthly (see build-flatpak.yml) because it is
# slow and self-updates; the AUR is cheap here because no compilation happens.
#
# Requires one repository secret:
#   AUR_SSH_PRIVATE_KEY -- a private key whose public half is registered on the
#                          AUR account that owns the package.
name: Publish to AUR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.4.0.5366-alpha)'
        required: true
      dry_run:
        description: 'Build and validate, but do not push to the AUR'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # makepkg --printsrcinfo is the only supported way to generate .SRCINFO, and it
    # only exists on Arch, so the whole job runs in an Arch container.
    container: archlinux:base-devel

    steps:
      - name: Resolve the tag being published
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          [ -n "$TAG" ] || { echo "::error::no tag to publish"; exit 1; }
          # pkgver is the tag without the leading v and the -alpha suffix.
          PKGVER="${TAG#v}"; PKGVER="${PKGVER%-alpha}"
          case "$PKGVER" in
            *[!0-9.]*) echo "::error::tag '$TAG' does not yield a numeric pkgver ('$PKGVER')"; exit 1 ;;
          esac
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "pkgver=$PKGVER" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG as pkgver $PKGVER"

      - name: Install tooling
        run: pacman -Syu --noconfirm --needed git openssh

      - uses: actions/checkout@v4

      - name: Bump the PKGBUILD to this release
        working-directory: packaging/aur
        run: |
          # One split package builds both outputs, so there is a single version to
          # bump and engine/data cannot drift apart.
          sed -i "s|^_tag=.*|_tag=${{ steps.tag.outputs.tag }}|" PKGBUILD
          sed -i "s|^pkgver=.*|pkgver=${{ steps.tag.outputs.pkgver }}|" PKGBUILD
          sed -i "s|^pkgrel=.*|pkgrel=1|" PKGBUILD
          grep -E '^(_tag|pkgver|pkgrel)=' PKGBUILD

      - name: Recompute the data archive checksum
        id: sums
        working-directory: packaging/aur
        run: |
          # The data package pins the release asset by hash, so the hash has to be
          # recomputed for each release. Downloaded once, here, rather than trusting
          # a value copied by hand.
          URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/keeperfx-linux-alpha-x86_64-full.7z"
          # The data package pins this archive by hash, but it is attached to the
          # release by the AppImage build, which runs after the release is published.
          # On a fresh release it is therefore legitimately not there yet.
          if ! curl -fsSL --retry 3 -o /tmp/full.7z "$URL"; then
            echo "::notice::$URL is not attached yet — re-run this workflow once the AppImage build has uploaded it"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SUM=$(sha256sum /tmp/full.7z | cut -d' ' -f1)
          echo "full.7z sha256 = $SUM"
          # The archive is the second source entry, so replace the second hash.
          python3 - "$SUM" <<'EOF'
          import re, sys
          s = open('PKGBUILD').read()
          head, rest = s.split("sha256sums=(\n", 1)
          body, tail = rest.split(")\n", 1)
          parts = [l.strip() for l in body.strip().split("\n")]
          parts[1] = "'" + sys.argv[1] + "'"
          open('PKGBUILD','w').write(head + "sha256sums=(\n" + "\n".join("  "+p for p in parts) + "\n)\n" + tail)
          EOF
          grep -A5 '^sha256sums' PKGBUILD
          rm -f /tmp/full.7z

      - name: Verify the tag actually exists upstream
        if: steps.sums.outputs.skip != '1'
        working-directory: packaging/aur
        run: |
          # Catches a release published before its tag propagated, which would
          # otherwise ship a PKGBUILD nobody can build.
          git ls-remote --exit-code --tags \
            https://github.com/${{ github.repository }}.git \
            "refs/tags/${{ steps.tag.outputs.tag }}"

      - name: Regenerate .SRCINFO
        if: steps.sums.outputs.skip != '1'
        working-directory: packaging/aur
        run: |
          # makepkg refuses to run as root, so do this as a normal user.
          useradd -m builder
          chown -R builder .
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO
          chown root .SRCINFO
          head -6 .SRCINFO

      - name: Sanity-check the generated metadata
        if: steps.sums.outputs.skip != '1'
        working-directory: packaging/aur
        run: |
          grep -q "pkgver = ${{ steps.tag.outputs.pkgver }}" .SRCINFO \
            || { echo "::error::.SRCINFO pkgver does not match the release"; exit 1; }
          grep -q "${{ steps.tag.outputs.tag }}" .SRCINFO \
            || { echo "::error::.SRCINFO does not reference the release tag"; exit 1; }
          # Both outputs must still be declared, or users lose one silently.
          for n in keeperfx-tux keeperfx-tux-data; do
            grep -q "^pkgname = $n\$" .SRCINFO \
              || { echo "::error::.SRCINFO no longer declares $n"; exit 1; }
          done
          echo "split package at ${{ steps.tag.outputs.tag }} declares both outputs"

      - name: Commit the bump back to this repo
        if: steps.sums.outputs.skip != '1' && !inputs.dry_run
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add packaging/aur/PKGBUILD packaging/aur/.SRCINFO
          if git diff --cached --quiet; then
            echo "PKGBUILDs already at this version; nothing to commit"
          else
            git commit -m "packaging: AUR package to ${{ steps.tag.outputs.tag }}"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - name: Push to the AUR
        if: steps.sums.outputs.skip != '1' && !inputs.dry_run
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY is not set — add it in Settings > Secrets"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF

          git config --global user.name  'KeeperFX Tux Edition CI'
          git config --global user.email 'noreply@users.noreply.github.com'

          # One AUR repository: the split package serves both outputs from it.
          if ! git clone ssh://aur@aur.archlinux.org/keeperfx-tux.git /tmp/aur 2>/tmp/aurerr; then
            cat /tmp/aurerr
            # Two states are expected rather than broken: the package has not been
            # imported yet (that first push has to be done by hand, CI only updates an
            # existing repo), and the AUR being in maintenance. Neither means this
            # release failed, so report and stop rather than failing the run.
            if grep -qi 'maintenance' /tmp/aurerr; then
              echo "::notice::the AUR is in maintenance; skipping the AUR publish for this release"
            else
              echo "::notice::keeperfx-tux is not on the AUR yet; run packaging/aur/import-to-aur.sh once, then re-run this workflow"
            fi
            exit 0
          fi
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO \
             packaging/aur/keeperfx-tux.sh packaging/aur/keeperfx-tux.desktop /tmp/aur/
          cd /tmp/aur
          git add -A
          if git diff --cached --quiet; then
            echo "AUR already up to date"
          else
            git commit -m "Update to ${{ steps.tag.outputs.pkgver }}"
            git push
          fi

      - name: Dry-run summary
        if: steps.sums.outputs.skip != '1' && inputs.dry_run
        working-directory: packaging/aur
        run: |
          echo "Dry run — nothing pushed. Generated metadata:"
          cat .SRCINFO
