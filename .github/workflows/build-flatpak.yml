# Builds the KeeperFX Linux Alpha Flatpak and attaches it to the latest release.
#
# Decoupled from the per-release AppImage build on purpose: the Flatpak is slow to
# build (~12 min) and currently sees little use, while the AppImage + in-launcher
# self-update is the main delivery path. This runs MONTHLY (and on demand) so a
# reasonably fresh .flatpak always sits on the latest release without slowing every
# release down. Like the AppImage, a slightly-old Flatpak self-updates to the latest
# engine/launcher on first launch, so it never needs to be cut every release.
#
# This workflow lives in the ENGINE repo (not the launcher repo, where it started)
# purely so the default GITHUB_TOKEN can attach the bundle to this repo's releases.
# A workflow in the launcher repo cannot write to another repo's releases without a
# PAT: the cross-repo upload failed with "HTTP 403: Resource not accessible by
# integration". The build itself still needs both repos, so the launcher is cloned
# below — the two repos simply swapped checkout/clone roles.
name: Build Flatpak (monthly / manual)

on:
  schedule:
    - cron: '0 6 1 * *'   # 06:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write        # needed to attach the bundle to the release

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  LAUNCHER_REPO: https://github.com/ForkedInTime/keeperfx-launcher-qt-linux.git
  LAUNCHER_BRANCH: alpha

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      # The Flatpak is the STABLE channel. It used to build whatever the alpha
      # branch held and attach to whatever release happened to be "latest" --
      # fine when only alphas existed, channel corruption once stable did: the
      # September cron would have attached an alpha-branch build stamped
      # "alpha" onto the stable release page.
      - name: Resolve the current stable release
        id: stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20                   --json tagName,isDraft,isPrerelease                   --jq '[.[] | select(.isDraft or .isPrerelease | not) | .tagName
                         | select((endswith("-alpha") or endswith("-prototype")) | not)][0]')
          [ -n "$TAG" ] && [ "$TAG" != "null" ] || { echo "::error::no stable release found"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building the Flatpak from stable $TAG"

      - name: Check out the engine at the stable tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.stable.outputs.tag }}
          fetch-depth: 0

      # Era-independent CI tooling comes from the branch the workflow itself runs
      # from, not from the (possibly older) stable tree being built: the payload
      # pruner works on any payload, and the stable tag simply predates it.
      # build-sdl3.sh is deliberately NOT grafted -- that one must match the
      # source tree's era, and its steps already skip when the tree lacks it.
      - name: Graft era-independent helpers from the workflow's branch
        run: |
          git fetch -q origin alpha
          for f in packaging/ci/prune-payload.sh docs/launcher-auto-file-removal.txt; do
            [ -e "$f" ] || git checkout FETCH_HEAD -- "$f" 2>/dev/null || true
          done
          ls -l packaging/ci/prune-payload.sh docs/launcher-auto-file-removal.txt || true       # full history, so the build number (git commit count) is correct

      # Cloned before the cache steps below, which hash files from inside it.
      - name: Clone the launcher (its packaging/ drives the Flatpak manifest)
        run: git clone --branch "$LAUNCHER_BRANCH" --depth 1 "$LAUNCHER_REPO" launcher

      - name: Install dependencies (launcher build + engine runtime libs + flatpak)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake ninja-build git pkg-config file wget desktop-file-utils python3 python3-pip p7zip-full \
            flatpak flatpak-builder elfutils \
            libgl1-mesa-dev zlib1g-dev \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1 \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libopenal-dev libluajit-5.1-dev libspng-dev libminizip-dev libepoxy-dev \
            libminiupnpc-dev libnatpmp-dev libssl-dev libzstd-dev \
            $(if [ -x packaging/ci/build-sdl3.sh ]; then packaging/ci/build-sdl3.sh --apt-packages; \
              else echo libsdl2-dev libsdl2-mixer-dev libsdl2-net-dev libsdl2-image-dev; fi)

      - name: Cache the SDL3 stack
        uses: actions/cache@v4
        with:
          path: deps/sdl3
          key: sdl3-${{ runner.os }}-${{ hashFiles('packaging/ci/build-sdl3.sh') }}

      # As in build-appimage.yml: the AppDir here is assembled by linuxdeploy too,
      # so LD_LIBRARY_PATH has to resolve libSDL3 for the bundling scan.
      # The SDL steps follow the ERA OF THE CHECKED-OUT TREE, not the workflow's.
      # This file runs from the alpha branch but builds a stable TAG; the current
      # stable predates the SDL3 migration, so it neither has build-sdl3.sh nor
      # wants an SDL3 stack -- it links the distro's SDL2. The first SDL3-era
      # stable makes the script reappear and this branch flips on its own.
      - name: Build the SDL3 stack (only when this tree uses SDL3)
        run: |
          if [ ! -x packaging/ci/build-sdl3.sh ]; then
            echo "SDL2-era tree: distro SDL2 packages already installed, no stack to build."
            exit 0
          fi
          packaging/ci/build-sdl3.sh
          eval "$(packaging/ci/build-sdl3.sh --env)"
          {
            echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
            echo "CPATH=$CPATH"
            echo "LIBRARY_PATH=$LIBRARY_PATH"
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          } >> "$GITHUB_ENV"

      # The launcher's bundled 7z.so cannot decompress RAR, which is why RAR
      # workshop items failed to install. Build 7-Zip's full-format library
      # instead. Era-guarded exactly like the SDL3 step above: this workflow
      # builds the current STABLE tag, and a stable that predates the script
      # simply keeps shipping the old ext/7z.so until the next stable carries it.
      - name: Cache the 7-Zip library
        uses: actions/cache@v4
        with:
          path: deps/7zip
          key: 7zip-${{ runner.os }}-${{ hashFiles('packaging/ci/build-7zip-lib.sh') }}

      - name: Build the 7-Zip library (only when this tree carries the script)
        run: |
          if [ ! -x packaging/ci/build-7zip-lib.sh ]; then
            echo "Pre-7zip-script tree: the committed launcher/ext/7z.so will be used."
            exit 0
          fi
          packaging/ci/build-7zip-lib.sh

      - name: Cache compiled objects (ccache)
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-flatpak-${{ github.run_id }}
          restore-keys: ccache-flatpak-

      - name: Cache CPM dependency sources (LIEF, etc.)
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ hashFiles('launcher/CMakeLists.txt', 'launcher/cmake/**', 'launcher/cpm-package-lock.cmake') }}
          restore-keys: cpm-

      - name: Cache Qt 6.8
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-6.8.3-linux-gcc64

      - name: Install Qt 6.8 (the launcher needs Qt >=6.7; 24.04 only has 6.4)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          pip install --break-system-packages aqtinstall
          python3 -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 -O "$RUNNER_TEMP/Qt"

      - name: Set up Qt + ccache environment
        run: |
          QT="$RUNNER_TEMP/Qt/6.8.3/gcc_64"
          echo "$QT/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$QT" >> "$GITHUB_ENV"
          echo "QMAKE=$QT/bin/qmake" >> "$GITHUB_ENV"
          ccache --max-size=1G --zero-stats

      - name: Build the launcher
        run: |
          cmake -S launcher -B launcher/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build launcher/build -j"$(nproc)"

      - name: Build the engine on 24.04 (the released Arch engine won't run on Ubuntu)
        run: |
          make -f linux.mk deps/centijson/include/json.h deps/astronomy/include/astronomy.h \
                           deps/enet6/include/enet6/enet.h deps/libcurl/lib/libcurl.a
          BN="$(git rev-list --count HEAD)"
          echo "Build number: $BN"
          rm -f src/ver_defs.h
          # VER_SUFFIX must be EXPLICITLY empty: linux.mk defaults an unset suffix
          # to "Prototype", and a Prototype-stamped install is a channel orphan the
          # launcher refuses to ever update. That exact bundle reached the stable
          # release for eleven minutes on 2026-08-11.
          make -f linux.mk BUILD_NUMBER="$BN" VER_SUFFIX= -j"$(nproc)"
          cd tools/fxfontmaker
          python3 rescale_unifont_hex.py unifont-17.0.04.hex unifont12.hex
          python3 bdf_to_hex.py wenquanyi_9pt.bdf wenquanyi.hex
          python3 merge_hex.py unifont12.hex wenquanyi.hex merged12.hex
          python3 unifont_hex_to_binary.py unifont-17.0.04.hex    font16.fxfont     16
          python3 unifont_hex_to_binary.py unifont_jp-17.0.04.hex font16_JPN.fxfont 16
          python3 unifont_hex_to_binary.py unifont_t-17.0.04.hex  font16_CHT.fxfont 16
          python3 unifont_hex_to_binary.py merged12.hex           font12.fxfont     12

      # The AppDir MUST be assembled inside launcher/, because the Flatpak manifest
      # resolves its sources relative to its own folder (launcher/packaging/) and
      # refers to "../AppDir". Building it anywhere else silently breaks the manifest.
      - name: Assemble the AppDir (launcher + engine + payload data)
        working-directory: launcher
        run: |
          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp build/keeperfx-launcher-qt "$APPDIR/usr/bin/"
          # Prefer the RAR-capable library built above; fall back to the
          # committed one on stable trees that predate the build script.
          if [ -f ../deps/7zip/7z.so ]; then
            cp ../deps/7zip/7z.so "$APPDIR/usr/bin/"
            install -Dm644 ../deps/7zip/7-zip-License.txt \
              "$APPDIR/usr/share/licenses/7-zip/License.txt"
          else
            cp ext/7z.so "$APPDIR/usr/bin/"
          fi
          install -Dm644 packaging/keeperfx-launcher-qt.png \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps/keeperfx-launcher-qt.png"
          install -Dm644 packaging/keeperfx-launcher-qt.desktop \
            "$APPDIR/usr/share/applications/keeperfx-launcher-qt.desktop"
          # payload = our previous release's data, with UPSTREAM's current data
          # overlaid on top. Mirrors the launcher repo's build-appimage.yml.
          #
          # Ours alone was a copy of a copy, so the multiplayer map data was never
          # present and fxdata/gtext_*.dat could never update -- the latter being why
          # the multiplayer service menu showed the original game's
          # "Serial / Modem / IPX" instead of "Online / LAN / Skirmish". But upstream's
          # package is not a superset of ours: it lacks the campgns/burdnimp level pack
          # and its ldata movies are the original 320x200 Smacker files where ours are
          # H.264 re-encodes. So ours is the base, upstream layers over it, and our
          # movies are restored afterwards.
          # NOTE: this resolves to the newest NON-PRERELEASE release. Alpha releases
          # must therefore be flagged prerelease on GitHub, or an alpha becomes the
          # payload base for the next stable. See docs/releasing.md.
          wget -q "https://github.com/${{ github.repository }}/releases/download/${{ steps.stable.outputs.tag }}/keeperfx-linux-alpha-x86_64-full.7z"
          7z x -bso0 keeperfx-linux-alpha-x86_64-full.7z -opkg

          UP_URL=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/dkfans/keeperfx/releases/latest \
            | python3 -c "import sys,json; print(next(a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if a['name'].endswith('_complete.7z')))")
          echo "upstream data package: $UP_URL"
          wget -q -O upstream-complete.7z "$UP_URL"
          7z x -bso0 upstream-complete.7z -oupstream
          find upstream -maxdepth 1 -type f \( -iname '*.exe' -o -iname '*.dll' \
            -o -iname '*.map' -o -iname 'launch.sh' \) -delete
          mkdir -p /tmp/ourmovies
          find pkg/ldata -maxdepth 1 -iname '*.smk' -exec cp -f {} /tmp/ourmovies/ \; 2>/dev/null || true
          cp -rf upstream/. pkg/
          if [ -n "$(ls -A /tmp/ourmovies 2>/dev/null)" ]; then
            cp -f /tmp/ourmovies/*.smk pkg/ldata/
            echo "restored $(ls /tmp/ourmovies | wc -l) re-encoded movie(s)"
          fi
          echo "payload base: $(du -sh pkg | cut -f1), $(find pkg -type f | wc -l) files"
          P="$APPDIR/payload"
          mkdir -p "$P"
          cp -rf pkg/. "$P/"
          cp -f ../bin/keeperfx "$P/keeperfx"
          # Overlay the freshly-built engine's game data over the downloaded payload.
          # This step was missing entirely here, so the Flatpak never even received the
          # config fix the AppImage got: every payload is assembled from the PREVIOUS
          # release's payload, so anything not overlaid stays frozen at whatever it
          # first shipped. config/ holds fxdata/creatrs/mods/music; campgns, levels,
          # lang and multiplayer live at the engine repo's top level. multiplayer/ was
          # never in any payload at all, which is why the engine reported no multiplayer
          # mappacks. These trees also carry large binary assets that exist only in the
          # payload, so this overlays text onto them rather than replacing them.
          # Mirrors the launcher repo's build-appimage.yml.
          for d in fxdata creatrs mods music; do
            if [ -d "../config/$d" ]; then
              mkdir -p "$P/$d"
              cp -rf "../config/$d/." "$P/$d/"
            fi
          done
          for d in campgns levels lang multiplayer; do
            if [ -d "../$d" ]; then
              mkdir -p "$P/$d"
              cp -rf "../$d/." "$P/$d/"
            fi
          done
          # keeperfx.cfg tracks the engine too: this repo's copy carries options the
          # upstream tagged package predates.
          [ -f ../config/keeperfx.cfg ] && cp -f ../config/keeperfx.cfg "$P/keeperfx.cfg"
          # Fonts are re-applied AFTER the overlay: they live in fxdata/ but are
          # generated, not part of config/, so the overlay would otherwise remove them.
          cp -f ../tools/fxfontmaker/*.fxfont "$P/fxdata/"
          # Drop files upstream has retired. The payload is assembled by overlaying onto
          # the PREVIOUS release's payload, so nothing is ever removed and obsolete data
          # accumulates release after release -- 555 files, 16 MiB by this point. The
          # launcher already deletes exactly these from the user's install on first run,
          # reading the same list, so shipping them means sending data purely for the
          # launcher to throw away.
          ../packaging/ci/prune-payload.sh "$P" ../docs/launcher-auto-file-removal.txt
          sed -n 's/.*VER_STRING  "\(.*\)".*/\1/p' ../src/ver_defs.h > "$P/version.txt"
          echo "Stamped version: $(cat "$P/version.txt")"
          # Gate BEFORE anything gets attached: the stamp must be the stable tag's
          # version with no channel suffix. A wrong stamp fails the build here
          # instead of publishing a mislabelled bundle.
          WANT="${{ steps.stable.outputs.tag }}"; WANT="${WANT#v}"
          STAMP="$(tr -d ' ' < "$P/version.txt")"
          if [ "$STAMP" != "$WANT" ]; then
            echo "::error::version.txt says '$(cat "$P/version.txt")' but this is a build of $WANT"
            exit 1
          fi
          cp -f build/keeperfx-launcher-qt "$P/keeperfx-launcher-qt"
          if [ -f ../deps/7zip/7z.so ]; then
            cp -f ../deps/7zip/7z.so "$P/7z.so"
            cp -f ../deps/7zip/7-zip-License.txt "$P/7-zip-License.txt"
          else
            cp -f ext/7z.so "$P/7z.so"
          fi
          cp -f ../bin/keeperfx "$APPDIR/usr/bin/keeperfx"   # for linuxdeploy lib scan

      - name: Get linuxdeploy + Qt plugin
        working-directory: launcher
        run: |
          base=https://github.com/linuxdeploy
          wget -q "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Bundle ALL libraries (launcher Qt + engine SDL3/ffmpeg/OpenAL/…)
        working-directory: launcher
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -d packaging/keeperfx-launcher-qt.desktop \
            -i packaging/keeperfx-launcher-qt.png \
            --plugin qt
          # the engine runs from the payload, not usr/bin — drop the duplicate
          rm -f AppDir/usr/bin/keeperfx

      - name: Install Flatpak runtime + builder
        run: |
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Build the Flatpak bundle
        working-directory: launcher
        run: |
          flatpak-builder --user --force-clean --repo=fp-repo fp-build \
            packaging/io.github.forkedintime.KeeperFXLinuxAlpha.yml
          flatpak build-bundle fp-repo "$GITHUB_WORKSPACE/KeeperFX-Linux-Alpha-x86_64.flatpak" \
            io.github.forkedintime.KeeperFXLinuxAlpha \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
          ls -la "$GITHUB_WORKSPACE/KeeperFX-Linux-Alpha-x86_64.flatpak"

      - name: Upload the Flatpak (downloadable from this CI run)
        uses: actions/upload-artifact@v4
        with:
          name: KeeperFX-Linux-Alpha-Flatpak
          path: KeeperFX-Linux-Alpha-x86_64.flatpak

      # Same-repo upload: the default GITHUB_TOKEN is scoped to this repo, so this
      # needs no PAT. This is the whole reason the workflow lives here.
      - name: Attach the Flatpak to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.stable.outputs.tag }}"
          echo "Attaching Flatpak to release $TAG"
          gh release upload "$TAG" KeeperFX-Linux-Alpha-x86_64.flatpak --clobber
