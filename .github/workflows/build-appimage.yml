# Builds the self-contained AppImage and the full.7z update package, and attaches
# both to the release that triggered it.
#
# This lives in the ENGINE repo rather than the launcher repo, for the same reason
# build-flatpak.yml does: a workflow only sees releases in its own repository, and
# the default GITHUB_TOKEN can only upload to its own repository's releases. Run
# from the launcher repo it could neither be triggered by an engine release nor
# attach anything to one, which is why those assets used to be uploaded by hand.
# The build itself still needs both repos, so the launcher is cloned below -- the
# two repos simply swap checkout/clone roles.
#
# The Flatpak (build-flatpak.yml) stays monthly and separate: it is slow to build
# and self-updates on launch, so it does not need cutting every release.
name: Build AppImage

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Which channel to stamp the build as (a release trigger takes this from its tag)'
        type: choice
        options: [alpha, stable]
        default: alpha

permissions:
  contents: write        # needed to attach the bundle to the release

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  LAUNCHER_REPO: https://github.com/ForkedInTime/keeperfx-launcher-qt-linux.git
  LAUNCHER_BRANCH: alpha

jobs:
  # A release published with its assets already attached (the normal flow: build by
  # dispatch, attach to a draft, publish) does not need rebuilding. Rebuilding it
  # produces the same binaries from the same commit, but recompresses the archive,
  # so the payload's checksum changes -- which silently invalidates the sha256 the
  # AUR recipe pinned moments earlier, and every `makepkg` then fails its integrity
  # check. Skip the rebuild when there is nothing missing to attach.
  check-assets:
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.probe.outputs.skip }}
    steps:
      - name: Does the release already carry both assets?
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "release" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          NAMES=$(gh release view "${{ github.event.release.tag_name }}" \
                    --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' || true)
          echo "$NAMES"
          if echo "$NAMES" | grep -q 'KeeperFX-Linux-Alpha-x86_64\.AppImage' \
             && echo "$NAMES" | grep -q 'keeperfx-linux-alpha-x86_64-full\.7z'; then
            echo "Both assets are already attached -- skipping the rebuild."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  appimage:
    needs: check-assets
    if: needs.check-assets.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history, so the build number (git commit count) is correct

      # Cloned before the cache steps below, which hash files from inside it.
      - name: Clone the launcher (its packaging/ provides the desktop entry and icon)
        run: git clone --branch "$LAUNCHER_BRANCH" --depth 1 "$LAUNCHER_REPO" launcher

      - name: Install dependencies (launcher build + engine runtime libs + appimage tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake ninja-build git pkg-config file wget desktop-file-utils python3 python3-pip p7zip-full \
            elfutils \
            libgl1-mesa-dev zlib1g-dev \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1 \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libopenal-dev libluajit-5.1-dev libspng-dev libminizip-dev libepoxy-dev \
            libminiupnpc-dev libnatpmp-dev libssl-dev libzstd-dev \
            $(packaging/ci/build-sdl3.sh --apt-packages)

      - name: Cache the SDL3 stack
        uses: actions/cache@v4
        with:
          path: deps/sdl3
          key: sdl3-${{ runner.os }}-${{ hashFiles('packaging/ci/build-sdl3.sh') }}

      # LD_LIBRARY_PATH matters beyond the compile here: linuxdeploy discovers what
      # to bundle by walking ldd output, and it has to be able to resolve libSDL3
      # out of this prefix or it will ship an AppImage without it.
      - name: Build the SDL3 stack (ubuntu-24.04 ships no SDL3 packages)
        run: |
          packaging/ci/build-sdl3.sh
          eval "$(packaging/ci/build-sdl3.sh --env)"
          {
            echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
            echo "CPATH=$CPATH"
            echo "LIBRARY_PATH=$LIBRARY_PATH"
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          } >> "$GITHUB_ENV"

      # The launcher extracts archives through whatever 7z.so sits beside it. The
      # copy committed at launcher/ext/7z.so cannot decompress RAR (it has the
      # NArchive::NRar5 handler but no NCompress::NRar5 decoder), so a RAR
      # workshop item listed its contents and then failed with "Unsupported
      # method" -- which is what broke installing item 414, "Infernal Rift".
      # Build 7-Zip's full-format library instead; the script refuses to emit one
      # without the RAR decoders, so this cannot silently regress.
      - name: Cache the 7-Zip library
        uses: actions/cache@v4
        with:
          path: deps/7zip
          key: 7zip-${{ runner.os }}-${{ hashFiles('packaging/ci/build-7zip-lib.sh') }}

      - name: Build the 7-Zip library (RAR-capable, replaces launcher/ext/7z.so)
        run: packaging/ci/build-7zip-lib.sh

      - name: Cache compiled objects (ccache)
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-appimage-${{ github.run_id }}
          restore-keys: ccache-appimage-

      - name: Cache CPM dependency sources (LIEF, etc.)
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ hashFiles('launcher/CMakeLists.txt', 'launcher/cmake/**', 'launcher/cpm-package-lock.cmake') }}
          restore-keys: cpm-

      - name: Cache Qt 6.8
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-6.8.3-linux-gcc64

      - name: Install Qt 6.8 (the launcher needs Qt >=6.7; 24.04 only has 6.4)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          pip install --break-system-packages aqtinstall
          python3 -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 -O "$RUNNER_TEMP/Qt"

      - name: Set up Qt + ccache environment
        run: |
          QT="$RUNNER_TEMP/Qt/6.8.3/gcc_64"
          echo "$QT/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$QT" >> "$GITHUB_ENV"
          echo "QMAKE=$QT/bin/qmake" >> "$GITHUB_ENV"
          ccache --max-size=1G --zero-stats

      - name: Build the launcher
        run: |
          cmake -S launcher -B launcher/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build launcher/build -j"$(nproc)"

      - name: Build the engine on 24.04 (the released Arch engine won't run on Ubuntu)
        run: |
          make -f linux.mk deps/centijson/include/json.h deps/astronomy/include/astronomy.h \
                           deps/enet6/include/enet6/enet.h deps/libcurl/lib/libcurl.a
          BN="$(git rev-list --count HEAD)"
          echo "Build number: $BN"
          # The suffix comes from the tag, not a hardcoded "alpha". The launcher
          # reads version.txt and treats a version with no suffix as STABLE and
          # anything containing "alpha" as ALPHA -- so a stable release built with
          # VER_SUFFIX=alpha would stamp itself alpha and be classified as one,
          # which defeats the point of tagging it stable. Tags look like
          # v1.4.0.5409-alpha or v1.4.0.5409.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # A dispatch has no tag -- GITHUB_REF_NAME is the branch, so the tag
            # rules below would read "alpha" and stamp every manual build as an
            # alpha, including the one built to become a stable release.
            case "${{ inputs.channel }}" in
              stable) VER_SUFFIX= ;;
              *)      VER_SUFFIX=alpha ;;
            esac
            echo "Manual build, channel '${{ inputs.channel }}' -> VER_SUFFIX='$VER_SUFFIX'"
          else
            TAG="${GITHUB_REF_NAME:-}"
            case "$TAG" in
              *-alpha)     VER_SUFFIX=alpha ;;
              *-prototype) VER_SUFFIX=Prototype ;;
              v[0-9]*)     VER_SUFFIX= ;;
              *)           VER_SUFFIX=alpha ;;
            esac
            echo "Tag '$TAG' -> VER_SUFFIX='$VER_SUFFIX'"
          fi
          rm -f src/ver_defs.h
          make -f linux.mk BUILD_NUMBER="$BN" VER_SUFFIX="$VER_SUFFIX" -j"$(nproc)"
          cd tools/fxfontmaker
          python3 rescale_unifont_hex.py unifont-17.0.04.hex unifont12.hex
          python3 bdf_to_hex.py wenquanyi_9pt.bdf wenquanyi.hex
          python3 merge_hex.py unifont12.hex wenquanyi.hex merged12.hex
          python3 unifont_hex_to_binary.py unifont-17.0.04.hex    font16.fxfont     16
          python3 unifont_hex_to_binary.py unifont_jp-17.0.04.hex font16_JPN.fxfont 16
          python3 unifont_hex_to_binary.py unifont_t-17.0.04.hex  font16_CHT.fxfont 16
          python3 unifont_hex_to_binary.py merged12.hex           font12.fxfont     12

      # The AppDir is assembled inside launcher/ because the desktop entry and icon
      # linuxdeploy needs live in launcher/packaging/, and the linuxdeploy steps below
      # run from there.
      - name: Assemble the AppDir (launcher + engine + payload data)
        working-directory: launcher
        run: |
          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp build/keeperfx-launcher-qt "$APPDIR/usr/bin/"
          # RAR-capable build from packaging/ci/build-7zip-lib.sh, not the
          # RAR-less ext/7z.so committed in the launcher repo.
          cp ../deps/7zip/7z.so "$APPDIR/usr/bin/"
          install -Dm644 ../deps/7zip/7-zip-License.txt \
            "$APPDIR/usr/share/licenses/7-zip/License.txt"
          install -Dm644 packaging/keeperfx-launcher-qt.png \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps/keeperfx-launcher-qt.png"
          install -Dm644 packaging/keeperfx-launcher-qt.desktop \
            "$APPDIR/usr/share/applications/keeperfx-launcher-qt.desktop"
          # payload = our previous release's data, with UPSTREAM's current data
          # overlaid on top. Mirrors the launcher repo's build-appimage.yml.
          #
          # Ours alone was a copy of a copy, so the multiplayer map data was never
          # present and fxdata/gtext_*.dat could never update -- the latter being why
          # the multiplayer service menu showed the original game's
          # "Serial / Modem / IPX" instead of "Online / LAN / Skirmish". But upstream's
          # package is not a superset of ours: it lacks the campgns/burdnimp level pack
          # and its ldata movies are the original 320x200 Smacker files where ours are
          # H.264 re-encodes. So ours is the base, upstream layers over it, and our
          # movies are restored afterwards.
          # Use the newest release that actually HAS the payload, skipping the tag
          # being built. "releases/latest" alone is not safe: a stable release
          # becomes latest the instant it is published, which is before its own
          # assets exist, so a stable build downloaded its own payload and got a
          # 404 (wget exit 8, an empty archive, and a failed release). Alphas never
          # hit it, being prereleases -- which is why it surfaced only on the first
          # stable patch. Prereleases stay excluded from the base for the reason
          # docs/releasing.md already gives: a stable payload must not be built on
          # top of an alpha's. See docs/releasing.md.
          BASE_TAG=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=50" \
            | jq -r --arg cur "${GITHUB_REF_NAME}" '[.[] | select(.draft == false and .prerelease == false) | select(.tag_name != $cur) | select(any(.assets[]; .name == "keeperfx-linux-alpha-x86_64-full.7z")) | .tag_name] | first // empty')
          if [ -z "$BASE_TAG" ]; then
            echo "::error::no earlier release carries keeperfx-linux-alpha-x86_64-full.7z to use as the payload base"
            exit 1
          fi
          echo "payload base taken from: $BASE_TAG"
          # Shell variables do not survive into the next step, and the patch step
          # needs to know what this payload was built on top of.
          echo "BASE_TAG=$BASE_TAG" >> "$GITHUB_ENV"
          wget -q "https://github.com/${GITHUB_REPOSITORY}/releases/download/${BASE_TAG}/keeperfx-linux-alpha-x86_64-full.7z"
          7z x -bso0 keeperfx-linux-alpha-x86_64-full.7z -opkg

          UP_URL=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/dkfans/keeperfx/releases/latest \
            | python3 -c "import sys,json; print(next(a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if a['name'].endswith('_complete.7z')))")
          echo "upstream data package: $UP_URL"
          wget -q -O upstream-complete.7z "$UP_URL"
          7z x -bso0 upstream-complete.7z -oupstream
          find upstream -maxdepth 1 -type f \( -iname '*.exe' -o -iname '*.dll' \
            -o -iname '*.map' -o -iname 'launch.sh' \) -delete
          mkdir -p /tmp/ourmovies
          find pkg/ldata -maxdepth 1 -iname '*.smk' -exec cp -f {} /tmp/ourmovies/ \; 2>/dev/null || true
          cp -rf upstream/. pkg/
          if [ -n "$(ls -A /tmp/ourmovies 2>/dev/null)" ]; then
            cp -f /tmp/ourmovies/*.smk pkg/ldata/
            echo "restored $(ls /tmp/ourmovies | wc -l) re-encoded movie(s)"
          fi
          echo "payload base: $(du -sh pkg | cut -f1), $(find pkg -type f | wc -l) files"
          P="$APPDIR/payload"
          mkdir -p "$P"
          cp -rf pkg/. "$P/"
          cp -f ../bin/keeperfx "$P/keeperfx"
          # Overlay the freshly-built engine's game data over the downloaded payload.
          # This overlay is what stops the payload freezing: it never received the
          # config fix the AppImage got: every payload is assembled from the PREVIOUS
          # release's payload, so anything not overlaid stays frozen at whatever it
          # first shipped. config/ holds fxdata/creatrs/mods/music; campgns, levels,
          # lang and multiplayer live at the engine repo's top level. multiplayer/ was
          # never in any payload at all, which is why the engine reported no multiplayer
          # mappacks. These trees also carry large binary assets that exist only in the
          # payload, so this overlays text onto them rather than replacing them.
          # Mirrors the launcher repo's build-appimage.yml.
          for d in fxdata creatrs mods music; do
            if [ -d "../config/$d" ]; then
              mkdir -p "$P/$d"
              cp -rf "../config/$d/." "$P/$d/"
            fi
          done
          for d in campgns levels lang multiplayer; do
            if [ -d "../$d" ]; then
              mkdir -p "$P/$d"
              cp -rf "../$d/." "$P/$d/"
            fi
          done
          # keeperfx.cfg tracks the engine too: this repo's copy carries options the
          # upstream tagged package predates.
          [ -f ../config/keeperfx.cfg ] && cp -f ../config/keeperfx.cfg "$P/keeperfx.cfg"
          # Fonts are re-applied AFTER the overlay: they live in fxdata/ but are
          # generated, not part of config/, so the overlay would otherwise remove them.
          cp -f ../tools/fxfontmaker/*.fxfont "$P/fxdata/"
          # Drop files upstream has retired. The payload is assembled by overlaying onto
          # the PREVIOUS release's payload, so nothing is ever removed and obsolete data
          # accumulates release after release -- 555 files, 16 MiB by this point. The
          # launcher already deletes exactly these from the user's install on first run,
          # reading the same list, so shipping them means sending data purely for the
          # launcher to throw away.
          ../packaging/ci/prune-payload.sh "$P" ../docs/launcher-auto-file-removal.txt
          # Ship the same list the prune just used.
          #
          # The launcher deletes retired files from a player's install by reading
          # launcher-auto-file-removal.txt FROM THE GAME DIRECTORY -- so the copy
          # that matters is the one in the payload, not the one in this repository.
          # Nothing ever put it there: the payload is assembled from the previous
          # release's payload, and this file was not in the overlay above, so the
          # shipped copy stayed frozen at whatever it was when it first arrived.
          # By 1.4.0.5488 the repository's list had 1582 entries and the payload's
          # 1523, and the 59-entry gap was the deletions that never reached anyone.
          #
          # Among them: multiplayer/classic/map00123.{apt,lgt,tng}. That map is
          # still shipped, without those three files -- all of which the engine
          # reads -- so an install that kept them loaded different action points,
          # lights and things for that map than a fresh install did.
          cp -f ../docs/launcher-auto-file-removal.txt "$P/launcher-auto-file-removal.txt"
          sed -n 's/.*VER_STRING  "\(.*\)".*/\1/p' ../src/ver_defs.h > "$P/version.txt"
          echo "Stamped version: $(cat "$P/version.txt")"
          cp -f build/keeperfx-launcher-qt "$P/keeperfx-launcher-qt"
          cp -f ../deps/7zip/7z.so "$P/7z.so"
          cp -f ../deps/7zip/7-zip-License.txt "$P/7-zip-License.txt"
          cp -f ../bin/keeperfx "$APPDIR/usr/bin/keeperfx"   # for linuxdeploy lib scan
          # Repackage that exact payload as the in-launcher update archive. This is what
          # the launcher's self-updater downloads, so it carries the same freshly built
          # engine, launcher and data the AppImage does.
          ( cd "$P" && 7z a -bso0 "$GITHUB_WORKSPACE/keeperfx-linux-alpha-x86_64-full.7z" . )
          ls -la "$GITHUB_WORKSPACE/keeperfx-linux-alpha-x86_64-full.7z"

      # Update patches: the same payload, minus everything that did not change.
      #
      # Almost nothing moves between releases. Measured on 1.4.0.5425 -> 1.4.0.5488,
      # 40 of 5674 files differed and the patch is 8.5MB against a 392MB full
      # payload -- 2.2% of the download, and most of that is the two binaries.
      # Sending the whole payload every time costs a player 390MB to receive what is
      # usually an engine and a launcher.
      #
      # Purely additive: full.7z is still built and attached exactly as before, and
      # nothing consumes these yet. A patch that cannot be built is a warning, never
      # a failed release -- the full payload remains the guaranteed path.
      #
      # One patch per plausible starting point: the payload base (the previous
      # stable, already downloaded above) and, when different, the newest release on
      # this release's own channel. The FROM version is in the filename so a client
      # can tell which patch applies to it.
      - name: Build update patches
        continue-on-error: true
        working-directory: launcher
        run: |
          set -uo pipefail
          # Spelled out rather than reusing $APPDIR: that is a shell variable from an
          # earlier step and does not exist here. The assemble step builds the AppDir
          # at $PWD/AppDir with working-directory: launcher, so this is that path.
          PATCH_SRC="$GITHUB_WORKSPACE/launcher/AppDir/payload"
          if [ ! -d "$PATCH_SRC" ]; then
              echo "::warning::no assembled payload at $PATCH_SRC; skipping patches"
              exit 0
          fi
          made=0

          emit_patch() {
              local from_tag="$1" archive="$2"
              local from_ver="${from_tag#v}"; from_ver="${from_ver%-alpha}"
              local out="$GITHUB_WORKSPACE/keeperfx-linux-alpha-x86_64-patch-from-${from_ver}.7z"
              echo "--- patch from ${from_tag} ---"
              # Captured explicitly: reading $? inside an if/else branch is easy to
              # get subtly wrong, and the difference here matters -- 2 means "nothing
              # changed", which is normal, and anything else is a real failure.
              bash "$GITHUB_WORKSPACE/packaging/ci/make-payload-patch.sh" \
                   "$PATCH_SRC" "$archive" "$out"
              local rc=$?
              if [ "$rc" -eq 0 ]; then
                  made=$((made + 1))
              elif [ "$rc" -eq 2 ]; then
                  echo "::notice::no patch from ${from_tag}: payload is unchanged"
              else
                  echo "::warning::could not build a patch from ${from_tag} (exit $rc)"
              fi
          }

          # The base payload this release was assembled on top of, downloaded earlier
          # in this job and still sitting in the working directory.
          if [ -n "${BASE_TAG:-}" ] && [ -f keeperfx-linux-alpha-x86_64-full.7z ]; then
              emit_patch "$BASE_TAG" "keeperfx-linux-alpha-x86_64-full.7z"
          else
              echo "::warning::no base payload on disk; skipping the base patch"
          fi

          # The newest release on this release's own channel, which for an alpha is a
          # different (and more useful) starting point than the stable base.
          CUR_TAG="${GITHUB_REF_NAME}"
          case "$CUR_TAG" in
              *-alpha) WANT='select(.prerelease == true)   | select(.tag_name | endswith("-alpha"))' ;;
              *)       WANT='select(.prerelease == false)  | select(.tag_name | endswith("-alpha") | not)' ;;
          esac
          PREV_TAG=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=50" \
            | jq -r --arg cur "$CUR_TAG" "[.[] | select(.draft == false) | $WANT | select(.tag_name != \$cur) | select(any(.assets[]; .name == \"keeperfx-linux-alpha-x86_64-full.7z\")) | .tag_name] | first // empty")

          # Only if it is genuinely EARLIER than what is being released. The query
          # asks for the newest release on this channel that is not the current tag,
          # which on a re-run of an older release's workflow returns something newer
          # -- and "patch-from-<a newer version>" is a backwards patch nobody can
          # use. Compare numerically; a plain string compare orders 5488 after 55554.
          prev_num="${PREV_TAG#v}"; prev_num="${prev_num%-alpha}"
          cur_num="${CUR_TAG#v}";   cur_num="${cur_num%-alpha}"
          if [ -n "$PREV_TAG" ] \
             && [ "$(printf '%s\n%s\n' "$prev_num" "$cur_num" | sort -V | head -1)" != "$cur_num" ]; then
              :
          else
              [ -n "$PREV_TAG" ] && echo "::notice::${PREV_TAG} is not earlier than ${CUR_TAG}; no same-channel patch"
              PREV_TAG=""
          fi

          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "${BASE_TAG:-}" ]; then
              if wget -q -O prev-payload.7z \
                   "https://github.com/${GITHUB_REPOSITORY}/releases/download/${PREV_TAG}/keeperfx-linux-alpha-x86_64-full.7z"; then
                  emit_patch "$PREV_TAG" "prev-payload.7z"
                  rm -f prev-payload.7z
              else
                  echo "::warning::could not download ${PREV_TAG}'s payload; skipping that patch"
              fi
          fi

          echo "patches built: $made"
          ls -la "$GITHUB_WORKSPACE"/keeperfx-linux-alpha-x86_64-patch-from-*.7z 2>/dev/null || true

      - name: Get linuxdeploy + Qt plugin + appimagetool
        working-directory: launcher
        run: |
          base=https://github.com/linuxdeploy
          wget -q "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage appimagetool-x86_64.AppImage

      - name: Bundle ALL libraries (launcher Qt + engine SDL3/ffmpeg/OpenAL/…)
        working-directory: launcher
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -d packaging/keeperfx-launcher-qt.desktop \
            -i packaging/keeperfx-launcher-qt.png \
            --plugin qt
          # the engine runs from the payload, not usr/bin — drop the duplicate
          rm -f AppDir/usr/bin/keeperfx

          # Close the transitive gaps linuxdeploy leaves behind.
          #
          # linuxdeploy skips anything on the AppImage "excludelist" -- libraries
          # assumed present everywhere. Three of those are needed by libraries it
          # DID bundle, so the AppDir shipped with dangling dependencies:
          #   libgpg-error.so.0  <- bundled libgcrypt.so.20, libssh-gcrypt.so.4
          #   libcom_err.so.2    <- bundled libkrb5.so.3, libgssapi_krb5.so.2
          #   libgmp.so.10       <- bundled libgnutls.so.30, libhogweed.so.6
          # Ubuntu and Arch happen to have all three, so it went unnoticed; a
          # Fedora 41 container failed with "libgpg-error.so.0: cannot open
          # shared object file" and Debian 13 with libcom_err, both before Qt
          # ever loaded. Verified: adding exactly these three takes both from
          # "did not start" to a clean launch.
          for lib in libgpg-error.so.0 libcom_err.so.2 libgmp.so.10; do
            src="$(find /usr/lib/x86_64-linux-gnu -maxdepth 1 -name "$lib" | head -1)"
            if [ -n "$src" ]; then
              cp -L "$src" "AppDir/usr/lib/$lib"
              echo "bundled missing transitive dep: $lib"
            else
              echo "::error::expected $lib on the runner but did not find it"; exit 1
            fi
          done

          # Fail the build if the AppDir still has a dependency it neither bundles
          # nor can assume, rather than shipping it and finding out per-distro.
          missing=0
          for f in AppDir/usr/lib/*.so* AppDir/usr/plugins/*/*.so AppDir/usr/bin/keeperfx-launcher-qt; do
            [ -f "$f" ] || continue
            objdump -p "$f" 2>/dev/null | awk '/NEEDED/{print $2}'
          done | sort -u | while read -r dep; do
            [ -e "AppDir/usr/lib/$dep" ] && continue
            case "$dep" in
              libc.so.6|libm.so.6|libdl.so.2|libpthread.so.0|librt.so.1|libresolv.so.2) continue ;;
              libstdc++.so.6|libgcc_s.so.1|ld-linux-x86-64.so.2|libutil.so.1|libnsl.so.1) continue ;;
              libX11.so.6|libxcb.so.1|libX11-xcb.so.1|libXext.so.6|libXau.so.6|libXdmcp.so.6) continue ;;
              libGL.so.1|libGLX.so.0|libOpenGL.so.0|libEGL.so.1|libGLdispatch.so.0) continue ;;
              libz.so.1|libdrm.so.2|libgbm.so.1|libxcb-dri3.so.0) continue ;;
              # Font/audio stack: deliberately left to the host, as the AppImage
              # excludelist intends -- bundling fontconfig fights the host's fonts.
              libfontconfig.so.1|libfreetype.so.6|libharfbuzz.so.0|libfribidi.so.0|libasound.so.2) continue ;;
            esac
            echo "::warning::AppDir depends on $dep but neither bundles nor can assume it"
          done

      - name: Install the custom AppRun (deploy payload to a writable install dir)
        working-directory: launcher
        run: |
          # linuxdeploy leaves AppRun as a SYMLINK into usr/bin; writing through it would
          # clobber the launcher binary, so remove it and write a real script at the root.
          rm -f AppDir/AppRun
          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          HERE="${APPDIR:-$(dirname "$(readlink -f "$0")")}"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="$HERE/usr/plugins"
          export QT_QPA_PLATFORM_PLUGIN_PATH="$HERE/usr/plugins/platforms"
          # We only bundle the xcb platform plugin; use it (via XWayland on Wayland) to
          # avoid the "Could not find the Qt platform plugin wayland" warning.
          export QT_QPA_PLATFORM="${QT_QPA_PLATFORM:-xcb}"
          INSTALL="${KFX_ALPHA_PREFIX:-$HOME/.local/share/keeperfx-alpha}"
          mkdir -p "$INSTALL"
          # Don't let our bundled glib load the SYSTEM gvfs/gio modules (symbol mismatch
          # on newer distros: 'g_variant_builder_init_static' undefined). Point GIO at an
          # empty dir so it loads none — Qt's own file dialogs are unaffected.
          mkdir -p "$INSTALL/.gio-modules"
          export GIO_MODULE_DIR="$INSTALL/.gio-modules"
          # deploy the bundled game once (or when the version changes)
          NEWVER="$(cat "$HERE/payload/version.txt" 2>/dev/null)"
          if [ "$(cat "$INSTALL/.bundled-version" 2>/dev/null)" != "$NEWVER" ]; then
            cp -rf "$HERE/payload/." "$INSTALL/"
            echo "$NEWVER" > "$INSTALL/.bundled-version"
          fi
          # The launcher + 7z.so live in the payload (deployed above), so an in-launcher
          # update can replace them. Only place them if MISSING — never clobber, or we'd
          # revert a launcher that the in-launcher update just upgraded.
          [ -x "$INSTALL/keeperfx-launcher-qt" ] || cp -f "$HERE/payload/keeperfx-launcher-qt" "$INSTALL/keeperfx-launcher-qt"
          [ -f "$INSTALL/7z.so" ] || cp -f "$HERE/payload/7z.so" "$INSTALL/7z.so" 2>/dev/null || true
          # Add an applications-menu entry so it's launchable like any installed game,
          # not just by finding the AppImage file. $APPIMAGE is the AppImage's own path.
          if [ -n "$APPIMAGE" ]; then
            appdir="$HOME/.local/share/applications"; icondir="$HOME/.local/share/icons"
            mkdir -p "$appdir" "$icondir"
            cp -f "$HERE/usr/share/icons/hicolor/256x256/apps/keeperfx-launcher-qt.png" "$icondir/keeperfx-linux-alpha.png" 2>/dev/null || true
            {
              echo "[Desktop Entry]"
              echo "Type=Application"
              echo "Name=KeeperFX Tux Edition"
              echo "Comment=Dungeon Keeper, native on Linux"
              echo "Exec=\"$APPIMAGE\""
              echo "Icon=$icondir/keeperfx-linux-alpha.png"
              echo "Terminal=false"
              echo "Categories=Game;StrategyGame;"
            } > "$appdir/keeperfx-linux-alpha.desktop"
            update-desktop-database "$appdir" 2>/dev/null || true
          fi
          cd "$INSTALL"
          exec "$INSTALL/keeperfx-launcher-qt" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Package the AppImage
        working-directory: launcher
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
        run: |
          ./appimagetool-x86_64.AppImage AppDir "$GITHUB_WORKSPACE/KeeperFX-Linux-Alpha-x86_64.AppImage"
          ls -la "$GITHUB_WORKSPACE/KeeperFX-Linux-Alpha-x86_64.AppImage"

      - name: Upload the AppImage (downloadable from this CI run)
        uses: actions/upload-artifact@v4
        with:
          name: KeeperFX-Linux-Alpha-AppImage
          path: KeeperFX-Linux-Alpha-x86_64.AppImage

      - name: Upload the full.7z update package (downloadable from this CI run)
        uses: actions/upload-artifact@v4
        with:
          name: keeperfx-linux-alpha-full-7z
          path: keeperfx-linux-alpha-x86_64-full.7z

      # Same-repo upload: the default GITHUB_TOKEN is scoped to this repo, so this
      # needs no PAT. This is the whole reason the workflow lives here rather than in
      # the launcher repo, where it could neither see this repo's releases nor be
      # triggered by them.
      - name: Attach the AppImage + full.7z to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            KeeperFX-Linux-Alpha-x86_64.AppImage \
            keeperfx-linux-alpha-x86_64-full.7z --clobber
          # Patches attach separately and never block the release: the full payload
          # above is the guaranteed path, and a missing patch only costs a player a
          # larger download.
          for p in keeperfx-linux-alpha-x86_64-patch-from-*.7z; do
            [ -e "$p" ] || continue
            gh release upload "${{ github.event.release.tag_name }}" "$p" --clobber \
              || echo "::warning::could not attach $p"
          done
