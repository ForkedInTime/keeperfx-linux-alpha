# Builds the KeeperFX Linux Alpha engine on an OLD base (Ubuntu 22.04) so the
# resulting binary runs on every modern Linux distro — Ubuntu, Fedora, Arch,
# Steam Deck — not just the machine it was built on. This runs on GitHub's
# servers; nothing is installed on your computer.
#
# Triggers:
#   * when you publish a Release  -> builds and attaches the package to it
#   * manually (Actions tab -> "Run workflow")
name: Build Linux Alpha

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write        # needed to attach the build to the release

jobs:
  build-engine:
    runs-on: ubuntu-24.04     # ffmpeg 6.x (the engine needs ffmpeg >=5.1); glibc 2.39 -> runs on 24.04+ / Fedora / Arch / Steam Deck. Truly-universal coverage (older LTS) needs the AppImage/Flatpak bundling layer (next milestone).
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history, so the build number (git commit count) is correct

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 pkg-config \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libopenal-dev libluajit-5.1-dev libspng-dev libminizip-dev zlib1g-dev \
            libepoxy-dev libminiupnpc-dev libnatpmp-dev libssl-dev libzstd-dev \
            $(packaging/ci/build-sdl3.sh --apt-packages)

      # Keyed on the script, which carries the pinned versions -- bumping SDL3
      # there invalidates this cache in the same commit.
      - name: Cache the SDL3 stack
        uses: actions/cache@v4
        with:
          path: deps/sdl3
          key: sdl3-${{ runner.os }}-${{ hashFiles('packaging/ci/build-sdl3.sh') }}

      - name: Build the SDL3 stack (ubuntu-24.04 ships no SDL3 packages)
        run: |
          packaging/ci/build-sdl3.sh
          eval "$(packaging/ci/build-sdl3.sh --env)"
          {
            echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
            echo "CPATH=$CPATH"
            echo "LIBRARY_PATH=$LIBRARY_PATH"
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          } >> "$GITHUB_ENV"

      - name: Fetch the auto-downloaded deps (serial, avoids a parallel-build race)
        run: |
          make -f linux.mk \
            deps/centijson/include/json.h deps/astronomy/include/astronomy.h \
            deps/enet6/include/enet6/enet.h deps/libcurl/lib/libcurl.a

      - name: Build the engine
        run: |
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          echo "Build number: $BUILD_NUMBER"
          # Suffix derived from the tag -- see the same block in build-appimage.yml.
          # A stable tag must not stamp itself "alpha", or the launcher classifies
          # the release as an alpha and the stable channel means nothing.
          TAG="${GITHUB_REF_NAME:-}"
          case "$TAG" in
            *-alpha)     VER_SUFFIX=alpha ;;
            *-prototype) VER_SUFFIX=Prototype ;;
            v[0-9]*)     VER_SUFFIX= ;;
            *)           VER_SUFFIX=alpha ;;
          esac
          echo "Tag '$TAG' -> VER_SUFFIX='$VER_SUFFIX'"
          rm -f src/ver_defs.h
          make -f linux.mk BUILD_NUMBER="$BUILD_NUMBER" VER_SUFFIX="$VER_SUFFIX" -j"$(nproc)"
          # expose a filename-safe version string (e.g. 1.3.2.5182-alpha)
          VER="$(sed -n 's/.*VER_STRING  "\(.*\)".*/\1/p' src/ver_defs.h | tr ' ' '-')"
          echo "PKG_VER=$VER" >> "$GITHUB_ENV"

      - name: Generate the UTF-8 fonts (needed since upstream #4920)
        run: |
          cd tools/fxfontmaker
          python3 rescale_unifont_hex.py unifont-17.0.04.hex unifont12.hex
          python3 bdf_to_hex.py wenquanyi_9pt.bdf wenquanyi.hex
          python3 merge_hex.py unifont12.hex wenquanyi.hex merged12.hex
          python3 unifont_hex_to_binary.py unifont-17.0.04.hex    font16.fxfont     16
          python3 unifont_hex_to_binary.py unifont_jp-17.0.04.hex font16_JPN.fxfont 16
          python3 unifont_hex_to_binary.py unifont_t-17.0.04.hex  font16_CHT.fxfont 16
          python3 unifont_hex_to_binary.py merged12.hex           font12.fxfont     12

      - name: Stage the portable engine package (engine + fonts + config + version)
        run: |
          S="dist/keeperfx-linux-alpha"
          mkdir -p "$S/fxdata" "$S/creatrs" "$S/mods" "$S/music"
          cp bin/keeperfx "$S/keeperfx"
          sed -n 's/.*VER_STRING  "\(.*\)".*/\1/p' src/ver_defs.h > "$S/version.txt"
          cp tools/fxfontmaker/*.fxfont "$S/fxdata/"
          cp -r config/fxdata/. "$S/fxdata/"
          cp -r config/creatrs/. "$S/creatrs/"
          cp -r config/mods/.    "$S/mods/"
          # Our own MusicReadme: the upstream one still says OGG only, which has
          # not been true since the engine gained format and naming freedom.
          cp -r config/music/.   "$S/music/"
          tar -C dist -czf "keeperfx-linux-alpha-${PKG_VER}-x86_64-portable.tar.gz" keeperfx-linux-alpha
          ls -la keeperfx-linux-alpha-*-portable.tar.gz

      - name: Upload the build (downloadable from this CI run)
        uses: actions/upload-artifact@v4
        with:
          name: keeperfx-linux-alpha-portable
          path: keeperfx-linux-alpha-*-x86_64-portable.tar.gz

      - name: Attach the build to the release (only when triggered by a release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: keeperfx-linux-alpha-*-x86_64-portable.tar.gz
